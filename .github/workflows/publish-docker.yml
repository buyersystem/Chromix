name: publish-docker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docker/**'
      - 'docs/docker.md'
      - '.github/workflows/publish-docker.yml'

permissions:
  contents: read

concurrency:
  group: publish-docker
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/xiaozhou26/chromix
  VERSION: 154.0.8037.57

jobs:
  build:
    if: github.repository == 'xiaozhou26/Chromix' && github.ref == 'refs/heads/main'
    name: Build and smoke (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Test Docker helpers
        run: python3 -m unittest discover -s docker/tests -v

      - uses: docker/setup-buildx-action@v3

      - name: Build native image for testing
        uses: docker/build-push-action@v6
        with:
          context: docker
          platforms: linux/${{ matrix.arch }}
          load: true
          push: false
          provenance: false
          tags: ${{ env.IMAGE }}:build-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=docker-${{ matrix.arch }}
          cache-to: type=gha,scope=docker-${{ matrix.arch }},mode=max

      - name: Allow container user namespaces on restricted AppArmor hosts
        shell: bash
        run: |
          if [[ -r /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]] && \
             [[ "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)" == 1 ]]; then
            sudo apparmor_parser --replace --skip-cache docker/apparmor.profile
            echo 'CHROMIX_APPARMOR_PROFILE=chromix-docker' >> "$GITHUB_ENV"
          fi

      - name: Smoke version, local page and active sandbox
        shell: bash
        run: |
          options=()
          if [[ -n "${CHROMIX_APPARMOR_PROFILE:-}" ]]; then
            options+=(--apparmor-profile "$CHROMIX_APPARMOR_PROFILE")
          fi
          python3 docker/smoke.py \
            "$IMAGE:build-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}" \
            "${options[@]}"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the tested image and save its digest
        env:
          ARCH: ${{ matrix.arch }}
        shell: bash
        run: |
          tag="$IMAGE:build-${{ github.run_id }}-${{ github.run_attempt }}-$ARCH"
          docker push "$tag"
          ref="$(docker image inspect "$tag" --format '{{index .RepoDigests 0}}')"
          [[ "$ref" =~ ^ghcr.io/xiaozhou26/chromix@sha256:[a-f0-9]{64}$ ]]
          mkdir -p digests
          printf '%s\n' "$ref" > "digests/$ARCH.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: docker-digest-${{ matrix.arch }}
          path: digests/*.txt
          if-no-files-found: error
          retention-days: 7

  merge:
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@v4
        with:
          pattern: docker-digest-*
          path: digests
          merge-multiple: true

      - name: Merge tested native images
        shell: bash
        run: |
          refs=()
          for arch in amd64 arm64; do
            ref="$(cat "digests/$arch.txt")"
            [[ "$ref" =~ ^ghcr.io/xiaozhou26/chromix@sha256:[a-f0-9]{64}$ ]]
            refs+=("$ref")
          done
          docker buildx imagetools create \
            --tag "$IMAGE:$VERSION" --tag "$IMAGE:latest" "${refs[@]}"
          docker buildx imagetools inspect --raw "$IMAGE:$VERSION" > manifest.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifests = json.loads(Path('manifest.json').read_text())['manifests']
          platforms = {(item['platform']['os'], item['platform']['architecture']) for item in manifests}
          assert len(manifests) == 2 and platforms == {('linux', 'amd64'), ('linux', 'arm64')}, manifests
          print('Verified multiarch manifest:', platforms)
          PY

      - name: Verify anonymous pull access
        shell: bash
        run: |
          config="$(mktemp -d)"
          trap 'rm -rf "$config"' EXIT
          # Package visibility must be set to public by the repository owner.
          docker --config "$config" pull "$IMAGE:$VERSION"
          docker --config "$config" manifest inspect "$IMAGE:latest" > /dev/null
