name: publish-docker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docker/**'
      - 'docs/docker.md'
      - '.github/workflows/publish-docker.yml'

permissions:
  contents: read

concurrency:
  group: publish-docker
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/xiaozhou26/chromix
  AMD64_VERSION: 154.0.8037.97
  ARM64_VERSION: 154.0.8037.57

jobs:
  build:
    if: github.repository == 'xiaozhou26/Chromix' && github.ref == 'refs/heads/main'
    name: Build and smoke (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Test Docker helpers
        run: python3 -m unittest discover -s docker/tests -v

      - uses: docker/setup-buildx-action@v3

      - name: Build native image for testing
        uses: docker/build-push-action@v6
        with:
          context: docker
          platforms: linux/${{ matrix.arch }}
          load: true
          push: false
          provenance: false
          tags: ${{ env.IMAGE }}:build-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=docker-${{ matrix.arch }}
          cache-to: type=gha,scope=docker-${{ matrix.arch }},mode=max

      - name: Allow container user namespaces on restricted AppArmor hosts
        shell: bash
        run: |
          if [[ -r /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]] && \
             [[ "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)" == 1 ]]; then
            sudo apparmor_parser --replace --skip-cache docker/apparmor.profile
            echo 'CHROMIX_APPARMOR_PROFILE=chromix-docker' >> "$GITHUB_ENV"
          fi

      - name: Smoke version, local page and active sandbox
        shell: bash
        run: |
          options=()
          if [[ -n "${CHROMIX_APPARMOR_PROFILE:-}" ]]; then
            options+=(--apparmor-profile "$CHROMIX_APPARMOR_PROFILE")
          fi
          python3 docker/smoke.py \
            "$IMAGE:build-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}" \
            --arch "${{ matrix.arch }}" "${options[@]}"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the tested image and save its digest
        env:
          ARCH: ${{ matrix.arch }}
        shell: bash
        run: |
          tag="$IMAGE:build-${{ github.run_id }}-${{ github.run_attempt }}-$ARCH"
          docker push "$tag"
          ref="$(docker image inspect "$tag" --format '{{index .RepoDigests 0}}')"
          [[ "$ref" =~ ^ghcr.io/xiaozhou26/chromix@sha256:[a-f0-9]{64}$ ]]
          mkdir -p digests
          printf '%s\n' "$ref" > "digests/$ARCH.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: docker-digest-${{ matrix.arch }}
          path: digests/*.txt
          if-no-files-found: error
          retention-days: 7

  merge:
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@v4
        with:
          pattern: docker-digest-*
          path: digests
          merge-multiple: true

      - name: Publish amd64 release and mixed-version latest
        shell: bash
        run: |
          docker buildx imagetools inspect --raw "$IMAGE:154.0.8037.57" > original-57.json
          refs=()
          for arch in amd64 arm64; do
            ref="$(cat "digests/$arch.txt")"
            [[ "$ref" =~ ^ghcr.io/xiaozhou26/chromix@sha256:[a-f0-9]{64}$ ]]
            refs+=("$ref")
          done
          docker buildx imagetools create --prefer-index=true \
            --tag "$IMAGE:$AMD64_VERSION" --tag "$IMAGE:amd64-$AMD64_VERSION" "${refs[0]}"
          docker buildx imagetools create \
            --tag "$IMAGE:latest" "${refs[@]}"
          for tag in "$AMD64_VERSION" "amd64-$AMD64_VERSION" latest; do
            docker buildx imagetools inspect --raw "$IMAGE:$tag" > "$tag.json"
          done
          docker buildx imagetools inspect --raw "$IMAGE:154.0.8037.57" > preserved-57.json
          cmp original-57.json preserved-57.json
          python3 - <<'PYCODE'
          import json
          import os
          from pathlib import Path
          version = os.environ['AMD64_VERSION']
          for tag, arches in ((version, {'amd64'}), (f'amd64-{version}', {'amd64'}),
                              ('latest', {'amd64', 'arm64'})):
              manifests = json.loads(Path(f'{tag}.json').read_text())['manifests']
              platforms = {(item['platform']['os'], item['platform']['architecture']) for item in manifests}
              assert len(manifests) == len(arches) and platforms == {('linux', arch) for arch in arches}, manifests
              for item in manifests:
                  arch = item['platform']['architecture']
                  expected = Path(f'digests/{arch}.txt').read_text().strip().split('@')[1]
                  assert item['digest'] == expected, (tag, item)
              print(f'Verified {tag}:', platforms)
          PYCODE

      - name: Verify anonymous pull access and per-architecture OCI versions
        shell: bash
        run: |
          config="$(mktemp -d)"
          trap 'rm -rf "$config"' EXIT
          # Package visibility must be set to public by the repository owner.
          docker --config "$config" pull --platform linux/amd64 "$IMAGE:$AMD64_VERSION"
          docker --config "$config" pull --platform linux/amd64 "$IMAGE:amd64-$AMD64_VERSION"
          docker --config "$config" manifest inspect "$IMAGE:latest" > /dev/null
          docker --config "$config" manifest inspect "$IMAGE:154.0.8037.57" > /dev/null
          for arch in amd64 arm64; do
            docker --config "$config" pull --platform "linux/$arch" "$IMAGE:latest"
            docker --config "$config" image inspect "$IMAGE:latest" > image.json
            python3 - "$arch" <<'PYCODE'
          import json
          import os
          from pathlib import Path
          import sys
          sys.path.insert(0, 'docker')
          from smoke import VERSIONS, check_image_metadata
          arch = check_image_metadata(json.loads(Path('image.json').read_text())[0], sys.argv[1])
          assert VERSIONS[arch] == os.environ[f'{arch.upper()}_VERSION']
          print(f'Anonymous pull: linux/{arch}, OCI version {VERSIONS[arch]}')
          PYCODE
          done
